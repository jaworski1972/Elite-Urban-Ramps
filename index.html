<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Elite Urban Ramps</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Elite Urban Ramps — wkrótce.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: oklch(98% 0.005 80);
    color: oklch(22% 0.01 260);
    font-family: 'Instrument Sans', system-ui, sans-serif;
    overflow-x: hidden;
  }
  .wrap {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 20px;
    position: relative;
  }
  .giant-bg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .giant-bg img {
    width: 92vw;
    max-width: 1300px;
    height: auto;
    opacity: 0.16;
  }
  .content { position: relative; z-index: 1; max-width: 640px; width: 100%; }
  .logo { height: 120px; width: auto; margin-bottom: 72px; display: block; margin-left: auto; margin-right: auto; transform: translateX(-30px); }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: oklch(55% 0.12 55);
    margin-bottom: 20px;
    text-transform: uppercase;
  }
  h1 {
    font-size: 40px;
    line-height: 1.15;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 18px;
  }
  .claim {
    font-size: 17px;
    line-height: 1.5;
    color: oklch(22% 0.01 260 / 0.72);
    max-width: 460px;
    margin: 0 auto 52px;
  }
  .countdown {
    display: flex;
    gap: 18px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 44px;
  }
  .unit {
    min-width: 78px;
    padding: 18px 10px;
    border: 1px solid oklch(22% 0.01 260 / 0.18);
    background: oklch(22% 0.01 260 / 0.03);
  }
  .unit .num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .unit .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: oklch(22% 0.01 260 / 0.5);
    margin-top: 6px;
  }
  .date-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: oklch(22% 0.01 260 / 0.45);
    margin-bottom: 40px;
  }
  @media (max-width: 600px) {
    .logo { height: 84px; margin-bottom: 52px; }
    h1 { font-size: 27px; }
    .claim { font-size: 15px; margin-bottom: 40px; }
    .unit { min-width: 62px; padding: 14px 6px; }
    .unit .num { font-size: 24px; }
    .countdown { gap: 10px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="giant-bg"><img src="assets/cad-watermark.png" alt="" /></div>
    <div class="content">
      <img class="logo" src="assets/logo-lockup-trimmed.png" alt="Elite Urban Ramps" />

      <div class="countdown" id="countdown">
        <div class="unit"><div class="num" id="cd-days">--</div><div class="label">dni</div></div>
        <div class="unit"><div class="num" id="cd-hours">--</div><div class="label">godz.</div></div>
        <div class="unit"><div class="num" id="cd-mins">--</div><div class="label">min</div></div>
        <div class="unit"><div class="num" id="cd-secs">--</div><div class="label">sek.</div></div>
      </div>

      <div class="date-line">15.09.2026</div>
    </div>
  </div>

  <script>
    var target = new Date('2026-09-15T00:00:00+02:00').getTime();
    function tick() {
      var now = Date.now();
      var diff = Math.max(0, target - now);
      var days = Math.floor(diff / 86400000);
      var hours = Math.floor((diff % 86400000) / 3600000);
      var mins = Math.floor((diff % 3600000) / 60000);
      var secs = Math.floor((diff % 60000) / 1000);
      var pad = function (n) { return String(n).padStart(2, '0'); };
      document.getElementById('cd-days').textContent = days;
      document.getElementById('cd-hours').textContent = pad(hours);
      document.getElementById('cd-mins').textContent = pad(mins);
      document.getElementById('cd-secs').textContent = pad(secs);
      if (diff <= 0) clearInterval(timer);
    }
    tick();
    var timer = setInterval(tick, 1000);
  </script>
</body>
</html>
